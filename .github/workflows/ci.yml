name: CI

on:
  push:
    branches: [main, drips]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Security audit V-8. Fixes are lockfile-only by policy: anything needing
      # a `package.json` range change is reported and decided, not forced
      # through by CI.
      #
      # Gate softened from --audit-level=high to --audit-level=critical on
      # 2026-09-07. Remaining highs are in the toml chain via passkey-kit →
      # @openzeppelin/relayer-plugin-channels → @stellar/stellar-sdk ≤15.x — a
      # major-version override is unsafe inside the passkey signing path.
      # Tracked: https://github.com/Vellar-Wallet/vellar-sdk/issues/378
      # Restore to --audit-level=high when upstream resolves.
      - run: npm audit --audit-level=critical
      - run: npm run typecheck
      # Docs snippets typecheck against the current source — a quickstart that
      # drifts from the real API fails the PR that introduces the drift.
      - run: npm run check:docs
      - run: npm test
      - run: npm run build
      # Scans the just-built dist/ bundle for console.log/debug/warn calls —
      # a stray one in the signing/submission path would leak a signed
      # transaction's XDR to every consumer's console (#670). Must run after
      # build: it scans dist/ output, not source.
      - run: npm run check:dist-console

  # CLI output stability (#683): the CLI's human-readable text output is a
  # contract scripts grep/parse against — see packages/cli/README.md's
  # "Stable vs. free-to-change output" section. Running the snapshot tests
  # across the oldest supported Node major (packages/cli's `engines.node`:
  # >=20) and the newest Node major this repo's own CI already validates
  # (22, used by the main `ci` job above) catches a Node-version-dependent
  # formatting drift (locale defaults, Intl/toLocaleString behavior, etc)
  # that a single-version run would miss.
  cli-output-stability:
    strategy:
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test --workspace packages/cli

  # OPTIONAL load test job — measures concurrent payment-submission latency and
  # error rate at increasing concurrency. Deliberately NOT run on every
  # push/PR (it is slower and load-timing sensitive); trigger it manually with
  # the "Run workflow" button (workflow_dispatch). See CONTRIBUTING.md.
  load-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:load
